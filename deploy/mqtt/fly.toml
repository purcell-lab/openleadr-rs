# fly.toml for the MQTT broker used by openleadr-vtn-au.
# Deploy from this directory: fly deploy --remote-only
app = "openleadr-mqtt-au"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# Public MQTT over secure websockets on 443.
[http_service]
  internal_port = 8080
  force_https = true
  # The VTN refuses to start if it cannot reach the broker, so the broker
  # must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# TCP check on the private MQTT listener.
[checks.mqtt]
  type = "tcp"
  port = 1883
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
