# One security policy for all listeners.
per_listener_settings false

# Private listener for the VTN, reached over Fly's private network
# (openleadr-mqtt-au.internal:1883). No Fly service maps this port,
# so it is not reachable from the internet.
listener 1883

# Public listener: MQTT over websockets. Fly terminates TLS on 443,
# so clients connect to wss://openleadr-mqtt-au.fly.dev
listener 8080
protocol websockets

# Anonymous clients may connect, but the ACL limits them to reading the
# public program and event topics (matching the VTN's PUBLIC_READS).
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Notifications are transient; nothing needs to survive a restart.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
