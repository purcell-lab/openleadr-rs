# fly.toml for the MQTT broker used by openleadr-vtn-au.
# Deploy from this directory: fly deploy --remote-only
app = "openleadr-mqtt-au"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# Public MQTT over secure websockets on 443.
[http_service]
  internal_port = 8080
  force_https = true
  # The VTN refuses to start if it cannot reach the broker, so the broker
  # must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Public MQTT over TLS on 8883. Fly terminates TLS (shared IPv4 is fine
# with the tls handler) and forwards plain MQTT to listener 1884.
[[services]]
  internal_port = 1884
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8883
    handlers = ["tls"]

# TCP check on the private MQTT listener.
[checks.mqtt]
  type = "tcp"
  port = 1883
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
